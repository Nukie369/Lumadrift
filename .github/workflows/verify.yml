name: Verify Luma Drift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate, test and build
        run: ./verify.sh
      - name: Verify browser runner and playable builds
        run: |
          python3 test-browser-runner.py
          python3 verify-browser.py --browser google-chrome
      - name: Verify offline game upgrades in one browser profile
        run: |
          python3 -m pip install playwright==1.55.0
          python3 test-worker-upgrade.py --browser google-chrome
      - name: Upload playable prototype
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luma-drift-standalone
          path: luma-drift-standalone-v8.2.html
