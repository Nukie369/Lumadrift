<!doctype html><meta charset="utf-8"><title>Mobile expedition smoke test</title>
<output id="result">RUNNING</output><iframe width="390" height="844" title="Luma Drift"></iframe>
<script>
const frame = document.querySelector('iframe');
const result = document.querySelector('output');
let stage = 0;
let expectedCredits = null;
let expectedMissionBadge = null;
let expectedMissionHidden = null;
frame.onload = () => {
  try {
    const doc = frame.contentDocument;
    const get = id => doc.getElementById(id);
    const check = (ok, message) => { if (!ok) throw Error(message); };
    if (stage === 3) {
      check(get('credits').textContent === expectedCredits, 'repeated reload duplicated banked cargo or mission rewards');
      check(get('energy').textContent === '0/5', 'repeated reload changed fuel');
      check(get('mission-badge').textContent === expectedMissionBadge && get('mission-badge').hidden === expectedMissionHidden, 'repeated reload changed mission state');
      result.textContent = 'PASS: mobile flights, mission claim, zero-fuel replay, free practice and repeated reload persistence';
      return;
    }
    if (stage === 2) {
      check(get('credits').textContent === expectedCredits, 'free practice changed wallet after reload');
      check(get('energy').textContent === '0/5', 'free practice changed fuel after reload');
      check(get('mission-badge').textContent === expectedMissionBadge && get('mission-badge').hidden === expectedMissionHidden, 'free practice changed mission badge after reload');
      // Reload once more to catch duplicate reward grants during repeated restoration.
      stage = 3;
      frame.src = 'luma-drift-standalone-v8.2.html?reload=3';
      return;
    }
    if (stage === 1) {
      check(get('credits').textContent === expectedCredits, 'mission reward not restored after reload');
      check(get('mission-badge').hidden, 'claimed mission reappeared after reload');
      check(get('energy').textContent === '3/5', 'fuel did not preserve two standard flights and one free practice flight after reload');
      Object.defineProperty(frame.contentWindow.crypto, 'getRandomValues', {configurable:true,value:a=>{a.fill(0xffffffff);return a;}});
      // Exhaust the remaining three fuel units through normal flights, then replay for free.
      for(let i=0;i<3;i++){
        get('again-btn').click();
        check(!get('run-controls').hidden, 'standard flight unavailable with remaining fuel');
        get('routes').firstElementChild.click();
        get('bank-btn').click();
      }
      check(get('energy').textContent === '0/5', 'standard flights did not consume remaining fuel');
      check(get('again-btn').textContent.includes('PRACTICE FREE'), 'zero-fuel results did not offer practice');
      check(get('again-btn').textContent.includes('NO REWARDS'), 'free practice reward disclosure missing');
      check(!get('again-btn').disabled && !get('again-btn').hidden, 'free practice not directly tappable');
      const replayTarget = get('again-btn').getBoundingClientRect();
      check(replayTarget.width >= 44 && replayTarget.height >= 44, 'zero-fuel practice touch target smaller than 44 CSS pixels');
      check(!get('end-earned').hidden, 'results disappeared before replay was selected');
      const creditsBeforePractice=get('credits').textContent;
      const missionBadgeBeforePractice=get('mission-badge').textContent;
      const missionBadgeHiddenBeforePractice=get('mission-badge').hidden;
      get('again-btn').click();
      check(!get('run-controls').hidden, 'zero-fuel replay did not launch practice');
      check(get('energy').textContent === '0/5', 'practice consumed fuel');
      get('routes').firstElementChild.click();
      get('bank-btn').click();
      check(get('end-earned').textContent === '0', 'practice granted rewards');
      check(get('credits').textContent === creditsBeforePractice, 'practice changed wallet');
      check(get('mission-badge').textContent === missionBadgeBeforePractice && get('mission-badge').hidden === missionBadgeHiddenBeforePractice, 'practice changed mission reward availability');
      // A second replay must remain freely playable rather than trapping an empty-tank player.
      check(get('again-btn').textContent.includes('PRACTICE FREE'), 'practice results did not offer another free replay');
      get('again-btn').click();
      check(!get('run-controls').hidden && get('energy').textContent === '0/5', 'second free replay unavailable');
      get('routes').firstElementChild.click();
      get('bank-btn').click();
      check(get('end-earned').textContent === '0', 'second practice granted rewards');
      check(get('credits').textContent === creditsBeforePractice, 'second practice changed wallet');
      check(get('mission-badge').textContent === missionBadgeBeforePractice && get('mission-badge').hidden === missionBadgeHiddenBeforePractice, 'second practice changed mission reward availability');
      expectedCredits = creditsBeforePractice;
      expectedMissionBadge = missionBadgeBeforePractice;
      expectedMissionHidden = missionBadgeHiddenBeforePractice;
      stage = 2;
      frame.src = 'luma-drift-standalone-v8.2.html?reload=2';
      return;
    }
    // Mobile usability: the game must not force sideways page scrolling at 390 CSS pixels.
    check(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 2, 'mobile viewport has horizontal overflow');
    check(get('credits').textContent === '150', 'standalone did not initialize');
    check(get('mission-badge').hidden, 'unexpected initial mission reward');
    get('practice-btn').click();
    check(!get('run-controls').hidden && get('energy').textContent === '5/5', 'practice launch');
    const practiceRoute = get('routes').firstElementChild;
    check(practiceRoute.textContent.includes('simulation only') && practiceRoute.textContent.includes('no rewards'), 'practice route visually implies earnable cargo');
    check(practiceRoute.getAttribute('aria-label').includes('simulated') && practiceRoute.getAttribute('aria-label').includes('no rewards awarded'), 'practice route accessibility label implies earnable cargo');
    // Fix the random draw for this test window only so both route outcomes are reproducible.
    const rng = value => Object.defineProperty(frame.contentWindow.crypto, 'getRandomValues', {
      configurable: true, value: a => { a.fill(value); return a; }
    });
    rng(0xffffffff);
    get('routes').firstElementChild.click();
    const cargo = Number(get('cargo').textContent);
    check(cargo > 0 && get('flight-forecast').textContent.includes(String(Math.floor(cargo * .75)) + ' ✦'), 'cargo forecast');
    rng(0);
    get('routes').firstElementChild.click();
    check(Number(get('cargo').textContent) === Math.floor(cargo * .75), 'storm damage');
    get('bank-btn').click();
    check(get('end-earned').textContent === '0', 'practice paid shards');
    for(let flight = 0; flight < 2; flight++){
      get('again-btn').click();
      rng(0xffffffff);
      if (flight === 0) {
        const standardRoute = get('routes').firstElementChild;
        check(standardRoute.textContent.includes('if you pass') && !standardRoute.textContent.includes('simulation only'), 'standard flight incorrectly labeled as practice');
        check(standardRoute.getAttribute('aria-label').includes('earn ') && !standardRoute.getAttribute('aria-label').includes('no rewards awarded'), 'standard route accessibility label incorrectly describes practice');
      }
      get('routes').firstElementChild.click();
      get('bank-btn').click();
    }
    check(get('mission-badge').textContent === '1', 'missing launch mission');
    get('missions-nav').click();
    get('daily-grid').querySelector('button:not(:disabled)').click();
    check(get('mission-badge').hidden, 'claimed mission still marked');
    expectedCredits = get('credits').textContent;
    check(Number(expectedCredits) > 150, 'mission reward not credited');
    stage = 1;
    frame.src = 'luma-drift-standalone-v8.2.html?reload=1';
  } catch (err) { result.textContent = 'FAIL: ' + err.message; }
};
frame.src = 'luma-drift-standalone-v8.2.html';
</script>
